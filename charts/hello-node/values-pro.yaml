# Окружение pro. Здесь только отличия от values.yaml.

replicaCount: 3

env:
  APP_MESSAGE: "Hello from production"
  LOG_LEVEL: "warn"

resources:
  requests:
    cpu: 200m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# У прода фиксированный хост, не зависящий от namespace.
ingress:
  enabled: true
  host: hello-node.localhost
