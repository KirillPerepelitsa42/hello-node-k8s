replicaCount: 3

image:
  repository: hello-node
  # Образ собран внутри minikube, в реестре его нет.
  pullPolicy: Never
  # Пусто: тег берётся из appVersion в Chart.yaml.
  tag: ""

nameOverride: ""
fullnameOverride: ""

# Порт, который слушает приложение внутри контейнера.
containerPort: 3000

service:
  type: ClusterIP
  port: 80

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# Значения для подстановки в шаблон конфига. Попадают в ConfigMap,
# init-контейнер получает их как переменные окружения.
env:
  APP_MESSAGE: "Hello from Helm!!!"
  LOG_LEVEL: "info"
  STARTUP_DELAY_SECONDS: "5"

# Шаблон config.yaml приложения. Init-контейнер заменяет ${ИМЯ} на значения
# переменных окружения: из env выше и из Secret.
preConfig: |
  app:
    message: "${APP_MESSAGE}"
    logLevel: ${LOG_LEVEL}
    startupDelaySeconds: ${STARTUP_DELAY_SECONDS}
  auth:
    apiToken: "${API_TOKEN}"
  featureFlags:
    newDashboard: false

# Secret создаётся вне чарта, чарт только ссылается на него.
existingSecret: hello-node-secret

# Образ init-контейнера с утилитой envsubst.
envsubst:
  image: bhgedigital/envsubst:v1.0-alpine3.6

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  periodSeconds: 5
  failureThreshold: 2

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 10
  failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
