apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hello-node.fullname" . }}-env
  labels:
    {{- include "hello-node.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hello-node.fullname" . }}-config
  labels:
    {{- include "hello-node.labels" . | nindent 4 }}
data:
  pre-config.yaml: |
    {{- .Values.preConfig | trim | nindent 4 }}
