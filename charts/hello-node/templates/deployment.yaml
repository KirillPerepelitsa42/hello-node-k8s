apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hello-node.fullname" . }}
  labels:
    {{- include "hello-node.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "hello-node.selectorLabels" . | nindent 6 }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      annotations:
        # Хэш ConfigMap: при изменении конфига меняется шаблон пода, и поды пересоздаются.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "hello-node.labels" . | nindent 8 }}
    spec:
      # Собирает config.yaml до старта приложения: подставляет значения в шаблон.
      initContainers:
        - name: render-config
          image: {{ .Values.envsubst.image }}
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              set -e
              : "${API_TOKEN:?API_TOKEN is not set}"
              envsubst < /templates/pre-config.yaml > /config/config.yaml
          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: API_TOKEN
          envFrom:
            - configMapRef:
                name: {{ include "hello-node.fullname" . }}-env
          volumeMounts:
            - name: pre-config
              mountPath: /templates
              readOnly: true
            - name: config
              mountPath: /config
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          env:
            - name: PORT
              value: {{ .Values.containerPort | quote }}
          volumeMounts:
            # Один файл поверх папки /app: без subPath том закрыл бы весь код приложения.
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        # Шаблон конфига из ConfigMap.
        - name: pre-config
          configMap:
            name: {{ include "hello-node.fullname" . }}-config
        # Пустая папка, общая для init-контейнера и приложения. Живёт, пока жив под.
        - name: config
          emptyDir: {}
